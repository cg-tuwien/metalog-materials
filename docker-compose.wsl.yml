# Override for Docker Desktop on Windows (WSL2): mounts the OptiX libraries
# extracted by scripts/docker/setup_optix_wsl.sh. Not needed on Linux hosts.
#
#   docker compose -f docker-compose.yml -f docker-compose.wsl.yml run --rm mlm ...
services:
  mlm:
    environment:
      DRJIT_LIBOPTIX_PATH: /opt/optix/libnvoptix.so.1
      LD_LIBRARY_PATH: /opt/optix
    volumes:
      - type: bind
        source: ./.optix-wsl
        target: /opt/optix
        read_only: true
      - type: bind
        source: ./.optix-wsl/nvoptix.bin
        target: /usr/share/nvidia/nvoptix.bin
        read_only: true
